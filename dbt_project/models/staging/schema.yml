version: 2

models:
  - name: stg_customers
    description: "Clients nettoyés (ville minuscules, état majuscules)."
    columns:
      - name: customer_id
        description: "Identifiant technique du client (PK)."
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Identifiant métier du client (un même client peut avoir plusieurs comptes)."
        data_tests:
          - not_null
      - name: customer_state
        data_tests:
          - not_null

  - name: stg_sellers
    description: "Vendeurs marketplace nettoyés."
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: stg_products
    description: "Produits avec catégorie traduite en anglais (repli sur le portugais, puis 'unknown')."
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_category_english
        data_tests:
          - not_null

  - name: stg_orders
    description: "Commandes, statut normalisé en minuscules."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']
      - name: order_purchase_timestamp
        data_tests:
          - not_null

  - name: stg_order_items
    description: "Lignes de commande : 1 ligne = 1 unité produit vendue."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
      - name: price
        data_tests:
          - not_null

  - name: stg_order_payments
    description: "Paiements des commandes."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_type
        data_tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_value
        data_tests:
          - not_null

  - name: stg_order_reviews
    description: "Avis clients (contient des doublons gérés en intermediate)."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: stg_geolocation
    description: "Coordonnées GPS brutes (plusieurs lignes par code postal)."
    columns:
      - name: geolocation_zip_code_prefix
        data_tests:
          - not_null

  - name: stg_category_translation
    description: "Dictionnaire des catégories PT -> EN."
    columns:
      - name: product_category_name
        data_tests:
          - unique
          - not_null
