name: elt_ecommerce
version: 1.0.0
config-version: 2
profile: elt_ecommerce

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
docs-paths: ["docs"]
clean-targets: ["target", "dbt_packages"]

models:
  elt_ecommerce:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

flags:
  send_anonymous_usage_stats: false
